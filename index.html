<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Фонетический тренажёр</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one study column. Home → section pages (Теория / Тест по теории / Практика) → mixed exam.
   Section colour runs through cards, tabs and chips; English examples are set in a textbook-like serif with real tonetic marks. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --sunk:#E7EBF1; --ink:#172033; --muted:#596379; --opt:#8C95A8; --line:#D6DCE6;
  --accent:#2F47B5; --ok:#16804A; --bad:#BE3A2F; --hl:#FFF0B3; --hl-ink:#172033;
  --c-s1:#0D7A84; --c-s2:#7440AE; --c-s3:#A86400; --c-s4:#BF3A69; --c-red:#2D7A33; --c-exam:#2F47B5;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-en:"Gentium Book Plus","Noto Serif","Times New Roman",Times,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F131B; --surface:#181D28; --sunk:#131822; --ink:#E5E9F2; --muted:#9CA4B6; --opt:#6F788C; --line:#2A3140;
  --accent:#95A8FF; --ok:#4CC683; --bad:#FF7D70; --hl:#4C4313; --hl-ink:#FFF2C2;
  --c-s1:#3FC2CC; --c-s2:#B58AF0; --c-s3:#EDA94A; --c-s4:#F27DA6; --c-red:#6FCB75; --c-exam:#95A8FF; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F131B; --surface:#181D28; --sunk:#131822; --ink:#E5E9F2; --muted:#9CA4B6; --opt:#6F788C; --line:#2A3140;
  --accent:#95A8FF; --ok:#4CC683; --bad:#FF7D70; --hl:#4C4313; --hl-ink:#FFF2C2;
  --c-s1:#3FC2CC; --c-s2:#B58AF0; --c-s3:#EDA94A; --c-s4:#F27DA6; --c-red:#6FCB75; --c-exam:#95A8FF; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,.tok{touch-action:manipulation}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}
.en{font-family:var(--f-en)}
h1,h2,h3{text-wrap:balance}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,4.4vw,32px);line-height:1.15;margin:0;letter-spacing:-.01em}
h2{font-family:var(--f-display);font-weight:500;font-size:19px;margin:0 0 12px}
h3{font-family:var(--f-display);font-weight:500;font-size:15px;margin:0}
.muted{color:var(--muted)}
.top{display:flex;flex-direction:column;gap:6px;margin-bottom:20px}
.crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.crumbs button{border:0;background:none;padding:0;cursor:pointer;color:var(--accent);font-weight:500}

/* home */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:12px;margin-bottom:28px}
.card{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:16px;text-align:left;cursor:pointer;display:grid;gap:6px;align-content:start;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--c)}
.card:hover{border-color:var(--c)}
.card .num{font-family:var(--f-display);font-weight:700;font-size:24px;color:var(--c);line-height:1}
.card .ttl{font-weight:600}
.card .sub{font-size:13.5px;color:var(--muted)}
.card .cnt{font-size:12.5px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px}
.scheme{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:12px}
.scheme .panel{margin:0}
.scheme ul{margin:6px 0 0;padding-left:18px;display:grid;gap:5px}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:6px 14px;margin-top:8px}
.legend span{display:flex;gap:10px;align-items:baseline;font-size:13.5px}
.legend b{font-family:var(--f-en);font-size:22px;font-weight:400;min-width:26px;text-align:center;line-height:1}

/* section header + tabs */
.sechead{display:grid;gap:4px;margin-bottom:16px;border-left:4px solid var(--c);padding-left:12px}
.sechead .num{font-family:var(--f-display);font-weight:700;color:var(--c);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:18px}
.tab{border:0;background:transparent;padding:9px 6px;border-radius:9px;cursor:pointer;font-weight:500;color:var(--muted);text-align:center}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.08)}

/* theory */
.legend-line{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin-bottom:14px}
.legend-line .must{color:var(--ink);font-weight:600}
.legend-line .lg-opt{color:var(--opt)}
.ph{display:grid;gap:8px}
.ph header{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;justify-content:space-between}
.chip-s{font-size:12.5px;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);border-radius:999px;padding:2px 9px;font-weight:500}
.cmt{font-family:var(--f-en);font-size:16px;line-height:1.55}
.cmt .o{color:var(--opt)}
.expl{font-size:13.5px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px}
.expl .en{font-size:15px}
.exs{display:flex;flex-wrap:wrap;gap:4px 16px;font-family:var(--f-en);font-size:17px}
.block-title{display:flex;gap:10px;align-items:baseline;margin:22px 0 8px}
.block-title h3{font-size:16px}
.block-note{font-size:14px;color:var(--muted);margin:0 0 10px;max-width:72ch}
.case{display:grid;grid-template-columns:52px minmax(0,1fr);gap:4px 14px;padding:14px 0;border-top:1px solid var(--line)}
.case:first-of-type{border-top:0}
.case .glyph{font-family:var(--f-en);font-size:30px;line-height:1;color:var(--c);text-align:center;padding-top:2px;white-space:nowrap}
.case .body{display:grid;gap:6px;min-width:0}
.case .tag{font-weight:600}
.case .note{font-size:13.5px;color:var(--muted)}
.mine{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-left:6px;font-weight:400}

/* marked english */
.sent{font-family:var(--f-en);font-size:clamp(18px,3.4vw,22px);line-height:1.9;margin:0;text-wrap:pretty;word-spacing:.04em}
.sent.small{font-size:16.5px;line-height:1.8}
.sent b{font-weight:700}
.ctx{color:var(--muted)}
.wave{display:inline-block;width:.55em;height:1.15em;vertical-align:-.22em;margin:0 .18em}
.wave path{fill:none;stroke:currentColor;stroke-width:1.5}
.bar{display:inline-block;width:1.5px;height:1.05em;background:currentColor;vertical-align:-.15em;margin:0 .35em}
.j{position:relative;display:inline-block}
.j::after{content:"";position:absolute;left:-1px;right:-1px;bottom:-.22em;height:.36em;border:1.6px solid currentColor;border-top:0;border-radius:0 0 50% 50%/0 0 100% 100%}
.mk{font-weight:400}
.tb{display:inline-block;margin-left:8px;vertical-align:middle;font-family:var(--f-body);font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px;line-height:1.6}

/* chips + controls */
.ctrls{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13.5px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;user-select:none}
.switch input{width:18px;height:18px;accent-color:var(--accent)}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}

/* runner */
.q{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:14px}
.qmeta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.qmeta .kind{color:var(--c);font-weight:600}
.pbar{height:4px;background:var(--sunk);border-radius:4px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.hint{font-size:14px;background:var(--sunk);border-radius:10px;padding:8px 12px}
.hint b{font-weight:600}
.task{font-weight:600;font-size:14.5px}
.opts{display:grid;gap:6px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;cursor:pointer;text-align:left;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:baseline}
.opt kbd{font-family:var(--f-body);font-size:11px;color:var(--muted);grid-row:1/3;align-self:center}
.opt .d{font-size:13px;color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--ink)}
button:disabled{cursor:default}
.right{border-color:var(--ok)!important;background:color-mix(in srgb,var(--ok) 12%,var(--surface))!important}
.wrong{border-color:var(--bad)!important;background:color-mix(in srgb,var(--bad) 10%,var(--surface))!important}
.dim{opacity:.5}
.fb{background:var(--sunk);border-radius:12px;padding:14px;display:grid;gap:8px}
.verdict{font-weight:600}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.say{display:grid;gap:10px;border-top:1px dashed var(--line);padding-top:12px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn.good{border-color:var(--ok);color:var(--ok)}
.btn.badb{border-color:var(--bad);color:var(--bad)}

/* marking */
.markline{font-family:var(--f-en);font-size:clamp(19px,3.6vw,23px);line-height:2.3;display:flex;flex-wrap:wrap;align-items:baseline;row-gap:2px}
.tok{border:0;background:none;padding:0 .14em;margin:0;border-radius:6px;cursor:pointer;font-family:inherit;font-size:inherit;line-height:1.5;border-bottom:2px solid transparent}
.tok:hover{background:var(--sunk)}
.tok.sel{background:var(--hl);color:var(--hl-ink)}
.tok.terr{border-bottom-color:var(--bad)}
.tok:disabled{cursor:default;color:inherit}
.tok b{font-weight:700}
.bnd{display:inline-flex;align-items:center;color:var(--ink)}
.bnd.berr{color:var(--bad)}
.miss{display:inline-block;width:6px;height:1.1em;border-left:2px dashed var(--bad);margin:0 .2em;vertical-align:-.15em}
.palette{display:grid;gap:8px;background:var(--sunk);border-radius:12px;padding:10px}
.prow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.prow .lbl{min-width:96px}
.pk{border:1px solid var(--line);background:var(--surface);border-radius:9px;cursor:pointer;min-width:46px;padding:4px 8px;display:grid;justify-items:center;line-height:1.1}
.pk .g{font-family:var(--f-en);font-size:22px;height:24px;display:flex;align-items:center}
.pk small{font-size:10.5px;color:var(--muted)}
.pk[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.pk[aria-pressed="true"] small{color:var(--bg)}
.selinfo{font-size:13px;color:var(--muted)}
.cmp{display:grid;gap:4px;font-size:14px}
.cmp .row{display:flex;gap:8px;align-items:baseline}
.cmp .row .lbl{min-width:70px}
.ok{color:var(--ok)} .bad{color:var(--bad)}

/* results */
.score{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:17px;color:var(--muted);font-weight:500}
.errs{display:grid;gap:12px}
.err{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:6px}


/* v2: tonograms, pieces, pairs, mirror */
.tgwrap{overflow-x:auto;margin:-4px 0 2px;color:var(--ink)}
.tg{display:block;max-width:none}
.tg .st{stroke:var(--line);stroke-width:1.2;fill:none}
.tg circle{fill:currentColor}
.tg .th{stroke:currentColor;stroke-width:3.4;stroke-linecap:round;fill:none}
.tg .nu{stroke:currentColor;stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round;fill:none}
.tg .bd{stroke:var(--muted);stroke-width:1.3;fill:none}
.built{min-height:2.2em;border:1px dashed var(--line);border-radius:10px;padding:8px 10px;line-height:1.9}
.piece{font-family:var(--f-en);font-size:15.5px;line-height:1.35;border-radius:8px;padding:3px 8px;display:inline}
.piece.in{background:color-mix(in srgb,var(--ok) 14%,transparent);padding:2px 4px}
.caret{color:var(--muted)}
.bank{display:flex;flex-wrap:wrap;gap:6px}
.btn-piece{border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;display:inline-block}
.btn-piece:hover:not(:disabled){border-color:var(--ink)}
.errline{display:flex;flex-wrap:wrap;gap:6px}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.pair>div{background:var(--sunk);border-radius:12px;padding:10px 12px;min-width:0}
table.mirror{border-collapse:collapse;width:100%;min-width:560px;font-size:13px}
table.mirror th,table.mirror td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
table.mirror thead th{font-size:12px;color:var(--muted);font-weight:600}
table.mirror tr.cur th{color:var(--c)}
.mc{display:inline-block;border-radius:6px;padding:2px 6px;margin:2px 3px 2px 0;font-size:12px;background:color-mix(in srgb,var(--k) 16%,transparent);color:var(--ink);border:1px solid color-mix(in srgb,var(--k) 45%,transparent)}
.mc-lr{--k:#2F6FD6}.mc-fall{--k:#C2412D}.mc-fr{--k:#8A3FB8}.mc-ml{--k:#7A7F8C}.mc-low{--k:#2F6FD6}.mc-long{--k:#A8661A}.mc-head{--k:#0D8A6A}.mc-pre{--k:#4FA38E}.mc-tail{--k:#B08A00}.mc-nuc{--k:#C2387A}
@media (max-width:560px){.tab{font-size:13px;padding:8px 2px}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}

@media (max-width:560px){
  .case{grid-template-columns:40px minmax(0,1fr)}
  .case .glyph{font-size:24px}
  .prow .lbl{min-width:100%}
  .q{padding:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* =========================================================================
   CONTENT — single source for the trainer page and the answer-key document.
   Tonetic marks (as in the textbook):
     ˈ stress (head)   ˌ low partial stress   · partial stress
     ˋ High Fall   ˎ Low Fall   ˏ Low Rise   ˊ High / Mid-High Rise
     ˇ Fall-Rise (undivided)   >  Mid Level
     ~  boundary between intonation groups (wavy line)   |  boundary with a longer pause
   Comment templates: {{...}} = optional part (можно не говорить);
     {p} phrase, {N} number of groups, {FR} "a Fall-Rise" / "a Fall-Rise Divided",
     {emo} politeness / affection / criticism, {after} auto note, {dir} Rise / Fall.
   ========================================================================= */

const SECTIONS = [
  { id: 's1', num: 'I',   title: 'Section I',   sound: 'Loss of plosion · Nasal plosion · Lateral plosion', inton: 'Intonation of non-final parts of utterances', fullComment: false },
  { id: 's2', num: 'II',  title: 'Section II',  sound: 'Fricative plosion · Alveolars before [θ, ð] · Clusters with [w]', inton: 'Intonation of parentheses', fullComment: true },
  { id: 's3', num: 'III', title: 'Section III', sound: 'Linking [r]', inton: 'Intonation of reporting phrases and reported speech', fullComment: true },
  { id: 's4', num: 'IV',  title: 'Section IV',  sound: 'Consonant clusters with [r]', inton: 'Intonation of direct address', fullComment: false },
];

/* ---------------------------- SOUND PHENOMENA ---------------------------- */
/* items: junction letters in [ ]; for r-clusters "word|cluster|condition" */
const SOUND = [
  // ---- Section I (на зачёте: только формула, без объяснения)
  { id: 'lp-c', sec: 's1', name: 'Complete loss of plosion', tag: 'Одинаковое место артикуляции',
    tpl: 'At the junction of two plosive consonants [{a}] and [{b}] having the same place of articulation, there is a complete loss of plosion of the first consonant.',
    ru: 'Смычка снимается беззвучно, взрыв слышен только после второго согласного.',
    items: ['ho[t d]og|t d','ol[d t]own|d t','bi[g c]ar|g k','sto[p p]laying|p p','gra[b b]ag|b b','ca[t t]oy|t t','goo[d d]og|d d','pin[k c]ake|k k','shi[p b]ell|p b','gol[d d]ust|d d','hea[d t]eacher|d t','bi[g g]ame|g g','whi[te t]ea|t t','ou[td]oor|t d','bla[ck g]loves|k g','li[p b]alm|p b'] },
  { id: 'lp-i', sec: 's1', name: 'Incomplete loss of plosion', tag: 'Разное место артикуляции',
    tpl: 'At the junction of two plosive consonants [{a}] and [{b}] having different places of articulation, there is an incomplete loss of plosion of the first consonant.',
    ru: 'Смычка первого согласного не снимается, пока не началась артикуляция второго. Взрыв первого очень слабый, отчётливый взрыв слышен только после второго согласного.',
    items: ['cha[pt]er|p t','fa[ct]|k t','la[pt]op|p t','su[bt]itle|b t','jum[ped]|p t','loo[ked]|k t','hu[gged]|g d','gra[bbed]|b d','ho[t c]offee|t k','ol[d b]ook|d b','bi[g b]ox|g b','sto[p t]alking|p t','sa[d g]irl|d g','pin[k d]ress|k d','bla[ckb]ird|k b','go[t b]ack|t b'] },
  { id: 'nasal', sec: 's1', name: 'Nasal plosion', tag: 'Взрыв через нос',
    tpl: 'At the junction of the plosive consonant [{a}] with the nasal sonorant [{b}], the phenomenon of nasal plosion takes place.',
    ru: 'Артикуляция сонанта начинается, когда артикуляция взрывного ещё не закончена. Смычка во рту не снимается, а воздух выходит через носовую полость.',
    items: ['ki[tten]|t n','ro[tten]|t n','wri[tten]|t n','fla[tten]|t n','ea[ten]|t n','co[tton]|t n','gar[den]|d n','su[dden]|d n','ha[dn]’t|d n','di[dn]’t|d n','coul[dn]’t|d n','goo[d n]ews|d n','ge[t m]arried|t m','su[bm]arine|b m','a[t m]idnight|t m'] },
  { id: 'lateral', sec: 's1', name: 'Lateral plosion', tag: 'Взрыв по бокам языка',
    tpl: 'At the junction of the plosive consonant [{a}] with the lateral sonorant [l], the phenomenon of lateral plosion takes place.',
    ru: 'Взрыв происходит во время произнесения сонанта: воздух проходит по бокам языка, опущенным для [l].',
    items: ['ca[ttle]|t l','bo[ttle]|t l','mi[ddle]|d l','sa[ddle]|d l','a[pple]|p l','ta[ble]|b l','bu[bble]|b l','ea[gle]|g l','[pl]an|p l','[bl]ack|b l','[gl]ass|g l','[cl]ock|k l','ba[d l]uck|d l','a[t l]unch|t l','ol[d l]ady|d l'] },

/* ---------- rendering English ---------- */
function markedHTML(s, phrase) {
  const toks = tokenize(s);
  const pr = phrase ? findPhrase(toks, phrase) : null;
  let wi = -1;
  return toks.map(t => {
    if (t.b) return bndHTML(t.b);
    wi++;
    let h = '';
    for (const ch of t.raw) h += MARKS.includes(ch) ? `<span class="mk">${esc(ch)}</span>` : esc(ch);
    const bold = t.bold || (pr && wi >= pr[0] && wi <= pr[1]);
    return bold ? `<b>${h}</b>` : h;
  }).join(' ').replace(/<\/b> <b>/g, ' ');
}
function soundHTML(raw) {
  const w = raw.split('|')[0];
  return esc(w).replace(/\[([^\]]+)\]/g, '<span class="j">$1</span>');
}
function commentHTML(str) {
  return segs(str).map(s => s.opt ? `<span class="o">${esc(s.t)}</span>` : esc(s.t)).join('');
}

/* ---------- theory quiz runner ---------- */
function quizRunner(host, qs, opts) {
  let queue = shuffle(qs.slice()), pos = 0, cur, answered = 0, right = 0, done = false, order;
  const limit = opts.limit || 0;
  const errs = [];
  function next() {
    if (limit && answered >= limit) return finish();
    if (pos >= queue.length) { queue = shuffle(qs.slice()); pos = 0; }
    cur = queue[pos++]; done = false;
    const [q, a, w, e] = cur.q;
    order = shuffle([a, ...w]);
    const sec = cur.sec;
    host.innerHTML = `<div class="q" style="--c:${COLORS[sec]}">
      <div class="qmeta"><span class="kind">${sec === 'red' ? 'Редукция' : 'Section ' + SEC[sec].num} · теория</span><span>${limit ? `Вопрос ${answered + 1} из ${limit} · ` : ''}верно ${right} из ${answered}</span></div>
      ${limit ? `<div class="pbar"><i style="width:${answered / limit * 100}%"></i></div>` : ''}
      <div class="task" style="font-size:16px">${esc(q)}</div>
      <div class="opts">${order.map((o, i) => `<button class="opt" data-i="${i}"><kbd>${i + 1}</kbd><span class="en" style="font-size:16px">${esc(o)}</span></button>`).join('')}</div>
      <div class="fb" hidden></div>
      <div class="btns"><button class="btn primary nx" hidden>Дальше →</button></div></div>`;
  }
  function pick(i) {
    if (done) return; done = true;
    const [q, a, w, e] = cur.q; const ok = order[i] === a;
    answered++; if (ok) right++; else { errs.push(cur); if (!limit) queue.splice(Math.min(pos + 3, queue.length), 0, cur); }
    host.querySelectorAll('.opt').forEach(b => { b.disabled = true; const t = order[+b.dataset.i]; if (t === a) b.classList.add('right'); else if (+b.dataset.i === i) b.classList.add('wrong'); else b.classList.add('dim'); });
    const fb = host.querySelector('.fb'); fb.hidden = false;
    fb.innerHTML = `<div class="verdict ${ok ? 'ok' : 'bad'}">${ok ? 'Верно!' : 'Не совсем.'}</div>${e ? `<div>${esc(e)}</div>` : ''}`;
    const nx = host.querySelector('.nx'); nx.hidden = false; nx.textContent = limit && answered >= limit ? 'Результат →' : 'Дальше →'; focusIf(nx);
  }
  function finish() {
    keyHandler = null;
    host.innerHTML = `<div class="q"><div class="score">${right}<small> / ${answered} верно</small></div>
      ${errs.length ? `<h3>Ошибки</h3><div class="errs">${errs.map(x => `<div class="err"><div>${esc(x.q[0])}</div><div class="en ok" style="font-size:16px">${esc(x.q[1])}</div></div>`).join('')}</div>` : '<p>Без ошибок!</p>'}
      <div class="btns"><button class="btn primary again">Ещё раз</button>${opts.back ? '<button class="btn back">Настройки</button>' : ''}</div></div>`;
    host.querySelector('.again').onclick = () => quizRunner(host, qs, opts);
    if (opts.back) host.querySelector('.back').onclick = opts.back;
  }
  host.onclick = e => { const o = e.target.closest('.opt'); if (o && !o.disabled) return pick(+o.dataset.i); if (e.target.closest('.nx')) next(); };
  keyHandler = e => { if (!done) { const n = +e.key; if (n >= 1 && n <= order.length) { e.preventDefault(); pick(n - 1); } } else if (e.key === 'Enter' && e.target.tagName !== 'BUTTON') { e.preventDefault(); next(); } };
  next();
}

/* ---------- practice setup (section) ---------- */
function practiceSetup(pane, id) {

    pane.innerHTML = `<p class="block-note">По примеру определи явление (шаг 1), потом скажи комментарий вслух и сравни с образцом (шаг 2).</p><div class="ctrls">
      ${isRed ? '' : `<div class="chips" role="group" aria-label="Тип заданий">${[['all', 'Всё'], ['sound', 'Звуковые явления'], ['inton', 'Интонация']].map(([k, t]) => `<button class="chip" data-f="${k}" aria-pressed="${filter === k}">${t}</button>`).join('')}</div>`}
</div><div id="run"></div>`;

/* ---------- options for the identification step ---------- */
function optionsFor(item) {
  if (item.kind === 'sound') {
    return SOUND.filter(p => p.sec === item.sec).map(p => ({ id: p.id, t: p.name, d: p.tag }));
  }
  if (item.kind === 'red') return RED_OPTS.map(o => ({ id: o.id, t: o.t, d: o.d }));
  const c = CASE[item.it.c];
  let list = CASES.filter(x => x.sec === c.sec && x.block === c.block);
  if (list.length < 4) { const extra = shuffle(CASES.filter(x => x.sec === c.sec && x.block !== c.block)).slice(0, 4 - list.length); list = list.concat(extra); }
  if (list.length > 7) list = [c, ...shuffle(list.filter(x => x !== c)).slice(0, 6)].sort((a, b) => CASES.indexOf(a) - CASES.indexOf(b));
  return list.map(x => ({ id: x.id, t: x.tag, d: x.block }));
}
const correctId = item => item.kind === 'sound' ? item.ph : item.kind === 'red' ? redKey(item.r) : item.it.c;
const KIND_NAME = { sound: 'Звуковое явление', inton: 'Интонация', red: 'Редукция' };
const secLabel = s => s === 'red' ? 'Редукция' : 'Section ' + SEC[s].num;

/* ---------- main practice / exam runner ---------- */
function runner(host, items, opts) {
  if (!items.length) { host.innerHTML = '<p class="muted">Нет заданий для выбранных настроек.</p>'; return; }
  let queue = opts.fixed ? items.slice() : shuffle(items.slice()), pos = 0, cur, st;
  const results = [];
  let answered = 0, full = 0;
  const limit = opts.limit || 0;

  function next() {
    if (limit && answered >= limit) return finish();
    if (pos >= queue.length) { queue = shuffle(items.slice()); pos = 0; }
    cur = queue[pos++];
    st = { stage: null, markOk: null, mcOk: null, selfOk: null, sel: 0, marks: [], bounds: [] };
    const sec = cur.sec;
    const tb = (cur.kind === 'inton' && cur.it.tb) || (cur.kind === 'red' && cur.r.tb);
    host.innerHTML = `<div class="q" style="--c:${COLORS[sec]}">
      <div class="qmeta"><span class="kind">${cur.kind === 'red' ? 'Редукция' : secLabel(sec) + ' · ' + KIND_NAME[cur.kind]}</span>
        <span>${limit ? `Задание ${answered + 1} из ${limit} · ` : ''}полностью верно ${full} из ${answered}</span></div>
      ${limit ? `<div class="pbar"><i style="width:${answered / limit * 100}%"></i></div>` : ''}
      <div class="prompt"></div><div class="stage"></div><div class="fb" hidden></div><div class="say" hidden></div></div>`;
    const prompt = host.querySelector('.prompt');
    if (cur.kind === 'sound') {
      prompt.innerHTML = `<p class="sent" style="font-size:clamp(24px,5vw,30px)">${soundHTML(cur.raw)}</p>`;
      stageMC();
    } else if (cur.kind === 'red') {
      prompt.innerHTML = `<p class="sent">${markedHTML(cur.r.s)}${tb ? '<span class="tb">из учебника</span>' : ''}</p>`;
      stageMC();
    } else {
      const it = cur.it;
      prompt.innerHTML = (it.x ? `<p class="sent small ctx">— ${markedHTML(it.x)}</p>` : '');
      if (opts.self) stageMark(); else { prompt.innerHTML += `<p class="sent">${it.x ? '— ' : ''}${markedHTML(it.s, it.p)}${tb ? '<span class="tb">из учебника</span>' : ''}</p>` + tgBlock(it.s); stageMC(); }
    }
  }

  /* --- self-marking --- */
  function stageMark() {
    st.stage = 'mark';
    const it = cur.it, toks = tokenize(it.s), ws = words(toks);
    st.toks = toks; st.ws = ws;
    st.marks = ws.map(() => null); st.bounds = ws.map(() => null);
    st.pr = it.p ? findPhrase(toks, it.p) : null;
    const stage = host.querySelector('.stage');
    stage.innerHTML = `${it.h ? `<div class="hint"><b>Ситуация:</b> ${esc(it.h)}</div>` : ''}
      <div class="task">Расставь ударения, ядерные тоны и границы групп. Нажми на слово, потом на знак.</div>
      <div class="markline en" aria-label="Предложение для разметки"></div>
      <div class="palette">
        <div class="selinfo"></div>
        <div class="prow"><span class="lbl">Ударение</span>${pk('ˈ', 'head')}${pk('·', 'partial')}${pk('ˌ', 'tail')}</div>
        <div class="prow"><span class="lbl">Ядерный тон</span>${pk('ˋ', 'High Fall')}${pk('ˎ', 'Low Fall')}${pk('ˏ', 'Low Rise')}${pk('ˊ', 'High Rise')}${pk('ˇ', 'Fall-Rise')}${pk('>', 'Mid Level')}${pk('', 'убрать', '✕')}</div>
        <div class="prow"><span class="lbl">Граница после</span>${bk(null, 'нет', '—')}${bk('~', 'группа', WAVE)}${bk('|', 'пауза', BAR)}</div>
      </div>
      <div class="btns"><button class="btn primary chk">Проверить разметку</button><button class="btn skip">Показать ключ</button></div>`;
    drawLine();
  }
  const pk = (ch, label, glyph) => `<button class="pk" data-mk="${esc(ch)}" title="${esc(MARK_NAME[ch] || label)}"><span class="g">${esc(glyph || ch)}</span><small>${esc(label)}</small></button>`;
  const bk = (b, label, glyph) => `<button class="pk" data-bd="${b || ''}" title="${esc(label)}"><span class="g">${glyph}</span><small>${esc(label)}</small></button>`;
  function wordHTML(t, mark, i) {
    // insert the student's mark where the key puts its main mark (or before the first letter)
    let at = t.mainAt;
    if (at === null || at === undefined) { const m = t.plain.search(/[A-Za-z]/); at = m < 0 ? 0 : m; }
    const p = t.plain;
    let h = esc(p.slice(0, at)) + (mark ? `<span class="mk">${esc(mark)}</span>` : '') + esc(p.slice(at));
    if (st.pr && i >= st.pr[0] && i <= st.pr[1]) h = `<b>${h}</b>`;
    return h;
  }
  function drawLine(check) {
    const line = host.querySelector('.markline');
    line.innerHTML = st.ws.map((t, i) => {
      const errN = check && check.nucErr.has(i), errB = check && check.bErr.has(i);
      let h = `<button class="tok${i === st.sel && !check ? ' sel' : ''}${errN ? ' terr' : ''}" data-w="${i}" ${check ? 'disabled' : ''}>${wordHTML(t, st.marks[i], i)}</button>`;
      if (st.bounds[i]) h += `<span class="bnd${errB ? ' berr' : ''}">${bndHTML(st.bounds[i])}</span>`;
      else if (errB) h += '<span class="miss" title="здесь граница"></span>';

    }).join('');
    if (!check) {
      const t = st.ws[st.sel];
      host.querySelector('.selinfo').innerHTML = `Выбрано: <b class="en" style="font-size:16px">${esc(t.plain)}</b>`;
      host.querySelectorAll('[data-mk]').forEach(b => b.setAttribute('aria-pressed', (st.marks[st.sel] || '') === b.dataset.mk && b.dataset.mk !== ''));

  function checkMarks(skip) {

    const keyB = ws.map(() => null); let wi = -1;
    toks.forEach(t => { if (t.b) keyB[wi] = t.b; else wi++; });
    const nucErr = new Set(), bErr = new Set(); const notes = [];

      if (!!keyB[i] !== !!st.bounds[i]) bErr.add(i);
      if (t.marks.some(m => m.ch === 'ˈ')) { stressKey++; if (st.marks[i] === 'ˈ') stressHit++; }
    });

    drawLine({ nucErr, bErr });
    host.querySelector('.palette').remove();
    host.querySelector('.stage .btns').remove();
    const it = cur.it, tb = it.tb;
    const res = document.createElement('div');
    res.className = 'fb';
    res.innerHTML = skip ? `<div class="verdict bad">Ключ разметки</div>` : `<div class="verdict ${ok ? 'ok' : 'bad'}">${ok ? 'Разметка верна!' : 'Есть расхождения с ключом.'}</div>
      <div class="cmp"><div class="row"><span class="lbl">Ядра</span><span class="${nucErr.size ? 'bad' : 'ok'}">${nucErr.size ? 'ошибки в словах: ' + [...nucErr].map(i => '«' + esc(ws[i].plain.replace(/[^\w’'-]/g, '')) + '»').join(', ') : 'все верно'}</span></div>
      <div class="row"><span class="lbl">Границы</span><span class="${bErr.size ? 'bad' : 'ok'}">${bErr.size ? 'не совпадают (пунктир — пропущенная граница)' : 'все верно'}</span></div>
      <div class="row"><span class="lbl">Ударения</span><span class="muted">совпало ${stressHit} из ${stressKey} (в шкале допустимы варианты, на оценку не влияет)</span></div>
      ${notes.map(n => `<div class="muted">${esc(n)}</div>`).join('')}</div>`;
    res.innerHTML += `<div><span class="lbl">Ключ</span><p class="sent" style="margin-top:2px">${it.x ? '— ' : ''}${markedHTML(it.s, it.p)}${tb ? '<span class="tb">из учебника</span>' : ''}</p></div>`;
    host.querySelector('.stage').appendChild(res);
    const holder = document.createElement('div'); holder.className = 'stage2';
    host.querySelector('.stage').appendChild(holder);
    stageMC(holder);
  }

  /* --- identification --- */
  function stageMC(where) {
    st.stage = 'mc';
    const target = where || host.querySelector('.stage');
    st.opts = optionsFor(cur);
    const ask = cur.kind === 'sound' ? 'Шаг 1. Какое звуковое явление происходит на стыке согласных, отмеченных дугой?' : cur.kind === 'red' ? `Шаг 1. К какой группе служебных слов относится «${cur.r.w}» и редуцируется ли оно в этом предложении?` : (cur.it.p ? `Шаг 1. Выделенная фраза — «${cur.it.p}». Как она произносится в этом предложении и с какой целью?` : 'Шаг 1. Каким тоном произносится первая (non-final) интонационная группа и с какой целью?');
    const hint = '';
    target.insertAdjacentHTML('beforeend', `${hint}<div class="task" style="margin-top:6px">${esc(ask)}</div>
      <div class="opts">${st.opts.map((o, i) => `<button class="opt" data-o="${o.id}"><kbd>${i + 1}</kbd><span>${esc(o.t)}</span><span class="d">${esc(o.d)}</span></button>`).join('')}</div>`);
  }
  function pickMC(id) {
    if (st.stage !== 'mc') return;
    const ok = id === correctId(cur); st.mcOk = ok; st.stage = 'say';
    host.querySelectorAll('.opt').forEach(b => { b.disabled = true; if (b.dataset.o === correctId(cur)) b.classList.add('right'); else if (b.dataset.o === id) b.classList.add('wrong'); else b.classList.add('dim'); });
    const fb = host.querySelector('.q > .fb'); fb.hidden = false;
    let why = '';
    if (cur.kind === 'inton') { const c = CASE[cur.it.c]; why = c.note || ''; }
    if (cur.kind === 'sound') { const p = PH[cur.ph]; why = p.tag; }
    if (cur.kind === 'red' && cur.r.note) why = cur.r.note;
    fb.innerHTML = `<div class="verdict ${ok ? 'ok' : 'bad'}">${ok ? 'Верно!' : 'Правильно: ' + esc(st.opts.find(o => o.id === correctId(cur)).t)}</div>${why ? `<div class="muted">${esc(why)}</div>` : ''}`;
    const say = host.querySelector('.say'); say.hidden = false;
    say.innerHTML = `<div class="task">Шаг 2. Скажи полный комментарий вслух, как на зачёте. Потом открой образец и сравни.</div><div class="btns"><button class="btn primary reveal">Показать образец</button></div>`;
    focusIf(say.querySelector('.reveal'));
  }
  function reveal() {
    if (st.stage !== 'say') return; st.stage = 'grade';
    const say = host.querySelector('.say');
    let extra = '';
    if (cur.kind === 'sound' && PH[cur.ph].ru) extra = `<div class="expl">${esc(PH[cur.ph].ru)}</div>`;
    say.innerHTML = `<div><span class="lbl">Образец</span> ${LEGEND_INLINE}</div><div class="cmt">${commentHTML(commentFor(cur))}</div>${extra}
      <div class="task" style="font-weight:500">Оцени себя:</div><div class="btns"><button class="btn good g-yes">Сказал(а) всё главное</button><button class="btn badb g-no">Пропустил(а) или ошибся(лась)</button></div>`;
    focusIf(say.querySelector('.g-yes'));
  }
  function grade(ok) {
    if (st.stage !== 'grade') return;
    st.selfOk = ok; answered++;
    const allOk = st.mcOk && ok && st.markOk !== false;
    if (allOk) full++;
    results.push({ item: cur, markOk: st.markOk, mcOk: st.mcOk, selfOk: ok, allOk });
    if (!allOk && opts.retry) queue.splice(Math.min(pos + 3, queue.length), 0, cur);
    next();
  }
  function finish() {
    keyHandler = null;
    const errs = results.filter(r => !r.allOk);
    const mcOk = results.filter(r => r.mcOk).length, mk = results.filter(r => r.markOk !== null), mkOk = mk.filter(r => r.markOk).length;
    host.innerHTML = `<div class="q"><div class="score">${full}<small> / ${answered} полностью верно</small></div>
      <div class="muted">Определение явления: ${mcOk} из ${answered}${mk.length ? ` · разметка: ${mkOk} из ${mk.length}` : ''} · комментарий: ${results.filter(r => r.selfOk).length} из ${answered}</div>
      <div class="btns">${errs.length ? `<button class="btn primary redo">Повторить ошибки (${errs.length})</button>` : ''}<button class="btn again">Новый набор</button>${opts.back ? '<button class="btn back">Настройки</button>' : ''}</div>
      ${errs.length ? `<h3>Разбор</h3><div class="errs">${errs.map(r => errHTML(r)).join('')}</div>` : '<p>Без ошибок!</p>'}</div>`;
    host.querySelector('.again').onclick = () => opts.again ? opts.again() : runner(host, items, opts);
    if (errs.length) host.querySelector('.redo').onclick = () => runner(host, errs.map(r => r.item), Object.assign({}, opts, { limit: errs.length, fixed: false }));
    if (opts.back) host.querySelector('.back').onclick = opts.back;
  }
  function errHTML(r) {
    const it = r.item;
    const what = [r.markOk === false ? 'разметка' : '', !r.mcOk ? 'определение' : '', !r.selfOk ? 'комментарий' : ''].filter(Boolean).join(', ');
    const s = it.kind === 'sound' ? `<p class="sent small">${soundHTML(it.raw)}</p>` : it.kind === 'red' ? `<p class="sent small">${markedHTML(it.r.s)}</p>` : `<p class="sent small">${markedHTML(it.it.s, it.it.p)}</p>`;
    return `<div class="err" style="--c:${COLORS[it.sec]}"><span class="qmeta"><span class="kind">${it.kind === 'red' ? 'Редукция' : secLabel(it.sec) + ' · ' + KIND_NAME[it.kind]}</span><span class="bad">${what}</span></span>${s}<div class="cmt">${commentHTML(commentFor(it))}</div></div>`;
  }

  host.onclick = e => {
    const tk = e.target.closest('.tok'); if (tk && !tk.disabled && st.stage === 'mark') { st.sel = +tk.dataset.w; drawLine(); return; }
    const m = e.target.closest('[data-mk]'); if (m && st.stage === 'mark') { st.marks[st.sel] = m.dataset.mk || null; drawLine(); return; }
    const bd = e.target.closest('[data-bd]'); if (bd && st.stage === 'mark') { st.bounds[st.sel] = bd.dataset.bd || null; drawLine(); return; }
    if (e.target.closest('.chk')) return checkMarks(false);
    if (e.target.closest('.skip')) return checkMarks(true);

const LEGEND_INLINE = '';

/* ---------- exam ---------- */
function renderExam() {

  app.innerHTML = header(true) + `<div class="sechead" style="--c:${COLORS.exam}"><span class="num">Перед экзаменом</span><h2 style="margin:0">Всё вперемешку</h2><span class="muted">Задания идут из разных секций по очереди, каждый раз набор новый. В конце будет разбор ошибок.</span></div><section id="pane"></section>`;

      <div><div class="lbl">Секции</div><div class="chips" style="margin-top:6px">${SECTIONS.map(s => chip('secs', s.id, 'Section ' + s.num, cfg.secs.includes(s.id))).join('')}${chip('secs', 'red', 'Редукция', cfg.secs.includes('red'))}</div></div>
      ${['comments', 'build', 'error', 'blitz'].includes(cfg.mode) ? `<div><div class="lbl">Для секций I–IV</div><div class="chips" style="margin-top:6px">${chip('types', 'sound', 'Звуковые явления', cfg.types.includes('sound'))}${chip('types', 'inton', 'Интонация', cfg.types.includes('inton'))}</div></div>
` : ''}
      ${cfg.mode === 'blitz' ? '' : `<div><div class="lbl">Количество</div><div class="chips" style="margin-top:6px">${[10, 20, 40].map(n => chip('n', n, n + ' заданий', cfg.n === n)).join('')}</div></div>`}
      <div class="btns"><button class="btn primary start">Начать</button></div></div>`;
  }
  pane.onclick = e => {
    const c = e.target.closest('.chip[data-g]');
    if (c) {
      const g = c.dataset.g, v = c.dataset.v;
      if (g === 'mode') cfg.mode = v; else if (g === 'n') cfg.n = +v;

    if (cfg.mode === 'pairs') { const ps = shuffle(PAIRS.filter(p => cfg.secs.includes(pairSec(p)))); return pairsGame(pane, ps, { limit: Math.min(cfg.n, ps.length), back: setup }); }
    if (cfg.mode === 'blitz') return blitzGame(pane, gpool(), { key: 'mix', back: setup });
    if (cfg.mode === 'theory') {
      const qs = cfg.secs.flatMap(s => QUIZ[s].map(q => ({ q, sec: s })));
      return quizRunner(pane, balanced(qs, x => x.sec, cfg.n), { limit: Math.min(cfg.n, qs.length), back: setup });
    }
    const pool = ITEMS.filter(i => cfg.secs.includes(i.sec) && (i.sec === 'red' || cfg.types.includes(i.kind)));
    const pick = balanced(pool, i => i.sec + ':' + i.kind + ':' + (i.kind === 'inton' ? i.it.c : i.kind === 'sound' ? i.ph : redKey(i.r)), cfg.n);
    runner(pane, pick, { self: false, limit: pick.length, fixed: true, back: setup, again: start });
  }
  setup();
}
/* round-robin over groups so every section / phenomenon / case shows up */
function balanced(pool, keyFn, n) {
  const groups = {};
  shuffle(pool.slice()).forEach(x => (groups[keyFn(x)] = groups[keyFn(x)] || []).push(x));
  // interleave by top-level key (section) first
  const keys = shuffle(Object.keys(groups));
  const bySec = {};
  keys.forEach(k => (bySec[k.split(':')[0]] = bySec[k.split(':')[0]] || []).push(k));
  const secs = shuffle(Object.keys(bySec));
  const out = [];
  let round = 0;
  while (out.length < n) {
    let added = false;
    for (const s of secs) {
      const ks = bySec[s]; if (!ks.length) continue;
      const k = ks[round % ks.length]; const g = groups[k];
      if (g && g.length) { out.push(g.shift()); added = true; if (out.length >= n) break; }
      else { ks.splice(ks.indexOf(k), 1); }
    }
    round++;
    if (!added && secs.every(s => !bySec[s].length)) break;
    if (round > 5000) break;
  }
  return shuffle(out);
}

route();
